name: Build CanvOS Provider image and Installer ISO

# Builds CanvOS +build-all-images against the dev stylus images in
# us-east1-docker.pkg.dev/spectro-images/dev/rutu/edge and pushes two artifacts:
#
#   provider image : us-east1-docker.pkg.dev/spectro-images/dev/rutu/edge:k3s-1.36.2-v0.0.0-558e008c-dev
#   installer ISO  : us-east1-docker.pkg.dev/spectro-images/dev/rutu/edge/palette-edge-installer:v0.0.0-558e008c-dev
#
# The registry and PE_VERSION are hardcoded in the .arg file written below --
# this is a one-off dev build, not a release. Edit them there when they change.
# Everything the build is configured by lives in that one file.
#
# The build consumes three stylus images from the same registry, at tag
# v0.0.0-558e008c: stylus-framework-linux-amd64, stylus-linux-amd64 and
# palette-edge-cli-amd64. They must already be published there; the preflight
# step checks that before the ~40 minute build starts.
#
# earthly.sh wraps the Earthly binary in Docker and needs three things from the
# runner:
#   - a Docker daemon that permits `docker run --privileged`, which Earthly needs
#   - $HOME/.docker/config.json present, so registry credentials get mounted into
#     the container -- it mounts that path only when the file exists, which is why
#     the login step runs before the build
#   - git tags, because earthly.sh calls `git describe --abbrev=0 --tags` before
#     it sources .arg (the .arg PE_VERSION wins, so this only avoids noise)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label. Luet-BigRunner is this repo's heavy-build runner; use ubuntu-latest if it is unavailable."
        required: true
        type: choice
        options:
          - Luet-BigRunner
          - ubuntu-latest
        default: Luet-BigRunner

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Only for GitHub-hosted runners, which start with far less free space than
      # the ISO build needs. Never do this on a self-hosted runner: the image
      # cache there is shared with other jobs.
      - name: Reclaim disk space
        if: inputs.runner == 'ubuntu-latest'
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Login to Artifact Registry
        run: |
          echo "${{ secrets.US_EAST_JSON_KEY_B64 }}" \
            | base64 -d \
            | docker login -u _json_key --password-stdin us-east1-docker.pkg.dev

      # earthly.sh sources this file and Earthly also loads it as its build-args
      # file (--arg-file-path defaults to ".arg"), so every value here reaches the
      # Earthfile as a build arg. Keep the heredoc quoted: several values are
      # meant to be literally empty.
      - name: Write .arg
        run: |
          cat > .arg <<'EOF'
          # Registry that the built provider image and installer ISO are pushed to.
          # The stylus framework / package / palette-edge-cli images are pulled
          # from $STYLUS_REGISTRY at tag $PE_VERSION.
          CUSTOM_TAG=dev
          IMAGE_REGISTRY=us-east1-docker.pkg.dev/spectro-images/dev/rutu
          IMAGE_REPO=edge
          PE_VERSION=v0.0.0-558e008c

          OS_DISTRIBUTION=ubuntu
          OS_VERSION=24.04
          K8S_DISTRIBUTION=k3s
          # Must stay pinned. Left empty, +build-provider-images loops over every
          # version in k8s_version.json (61 of them for k3s).
          K8S_VERSION=1.36.2

          ISO_NAME=palette-edge-installer
          ARCH=amd64

          STYLUS_REGISTRY=us-east1-docker.pkg.dev/spectro-images/dev/rutu/edge

          # Package the installer ISO as an OCI image too, so --push publishes it
          # instead of only leaving a file in ./build.
          ISO_DISK_IMAGE=true

          # Empty on purpose: earthly.sh then takes its non-proxy path. The proxy
          # path runs `docker exec -it`, which has no TTY in CI.
          HTTPS_PROXY=
          HTTP_PROXY=

          UPDATE_KERNEL=false
          CIS_HARDENING=false
          EOF
          echo "--- .arg ---"
          cat .arg

      - name: Preflight - stylus source images readable
        run: |
          if ! docker buildx version > /dev/null 2>&1; then
            echo "buildx is not available; skipping preflight"
            exit 0
          fi
          source ./.arg
          for img in stylus-framework-linux-amd64 stylus-linux-amd64 palette-edge-cli-amd64; do
            ref="${IMAGE_REGISTRY}/${IMAGE_REPO}/${img}:${PE_VERSION}"
            if ! docker buildx imagetools inspect "$ref" > /dev/null; then
              echo "::error::cannot resolve $ref -- is it published, and does this credential have read access to it?"
              exit 1
            fi
            echo "OK   $ref"
          done

      # --ci suppresses local artifact output, so the multi-GB ISO is not written
      # to ./build on the runner; --push still publishes both images.
      - name: Build and push provider image and installer ISO
        run: ./earthly.sh --ci --push +build-all-images

      - name: Summary
        if: always()
        run: |
          source ./.arg
          {
            echo "### CanvOS provider image + installer ISO"
            echo
            echo "Inputs: PE_VERSION=\`$PE_VERSION\`  k8s=\`$K8S_DISTRIBUTION-$K8S_VERSION\`  os=\`$OS_DISTRIBUTION-$OS_VERSION\`"
            echo
            echo "| artifact | pushed reference |"
            echo "| --- | --- |"
            echo "| provider image | \`$IMAGE_REGISTRY/$IMAGE_REPO:$K8S_DISTRIBUTION-$K8S_VERSION-$PE_VERSION-$CUSTOM_TAG\` |"
            echo "| installer ISO | \`$IMAGE_REGISTRY/$IMAGE_REPO/$ISO_NAME:$PE_VERSION-$CUSTOM_TAG\` |"
          } >> "$GITHUB_STEP_SUMMARY"
