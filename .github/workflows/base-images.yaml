name: Build Kairos Base Images

# Builds the credential-free ("public") Spectro Kairos base images with docker
# bake, from base-images/docker-bake.hcl:
#
#   public-distro  kairosify-ubuntu-22-04, kairosify-ubuntu-24-04,
#                  kairosify-opensuse-16-0, ubuntu-uki-24-04
#   public-hadron  hadron-std / hadron-fips / hadron-uki / hadron-fips-uki and
#                  the Spectro hadron-modules image
#   public         both of the above
#
# What is built:
#   base_os_image set     only kairosify-custom from that image (`target` ignored)
#   target = all          every image above: the bake `public` group (default)
#   target = hadron-all   all Hadron variants (public-hadron)
#   target = <one image>  that bake target; Hadron variants also push hadron-modules
#
# Tags come from the bake file, e.g.
#   <registry>/kairos-ubuntu:24.04-core-amd64-generic-v4.4.0
#   <registry>/kairos-hadron:v0.5.3-core-amd64-generic-v4.4.0-fips-uki
#
# Every image is single-architecture; run once per arch.
#
# Credential tiers (rhsm, satellite, pro, scc) are not built here. Images go to
# the dev registry; promotion to production is a separate, manual retag.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Bake target to build (ignored when base_os_image is set)"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - kairosify-ubuntu-22-04
          - kairosify-ubuntu-24-04
          - kairosify-opensuse-16-0
          - ubuntu-uki-24-04
          - hadron-all
          - hadron-std
          - hadron-fips
          - hadron-uki
          - hadron-fips-uki
      base_os_image:
        description: "Kairosify this upstream image instead (builds only kairosify-custom)"
        required: false
        type: string
        default: ""
      arch:
        description: "Architecture"
        required: false
        type: choice
        options:
          - amd64
          - arm64
        default: "amd64"
      kairos_version:
        description: "Kairos version (also the kairos-init image tag and the image tag suffix)"
        required: false
        type: string
        default: "v4.4.0"
      hadron_version:
        description: "Hadron version (must be listed in base-images/hadron/modules.json)"
        required: false
        type: string
        default: "v0.5.3"
      registry:
        description: "Registry prefix for the built images"
        required: false
        type: string
        default: "us-east1-docker.pkg.dev/spectro-images/dev/edge/base"

permissions:
  contents: read

# One run at a time per target and arch; different targets run in parallel.
# No branch in the key: tags carry no branch name, so the same target built from
# two branches would push to the same tags. The group is per dispatch value, so
# overlapping choices (e.g. `all` and `hadron-fips`) can still run together.
concurrency:
  group: base-images-${{ inputs.arch }}-${{ inputs.base_os_image != '' && format('kairosify-custom-{0}', inputs.base_os_image) || inputs.target }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.base_os_image != '' && 'kairosify-custom' || inputs.target }} (${{ inputs.arch }})
    runs-on: Luet-BigRunner
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU (arm64 on an x86 runner)
        if: inputs.arch == 'arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Inputs reach the shell through env, never through ${{ }} in the script,
      # so a crafted input cannot inject commands.
      - name: Resolve targets
        id: targets
        env:
          BASE_OS_IMAGE: ${{ inputs.base_os_image }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_OS_IMAGE}" ]; then
            targets="kairosify-custom"
          else
            case "${TARGET}" in
              # hadron-modules is implicit: always pushed with Hadron.
              all)        targets="public" ;;
              hadron-all) targets="public-hadron" ;;
              hadron-*)   targets="${TARGET},hadron-modules" ;;
              *)          targets="${TARGET}" ;;
            esac
          fi
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_KEY_B64: ${{ secrets.US_EAST_JSON_KEY_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_KEY_B64}" | base64 -d \
            | docker login -u _json_key --password-stdin "${REGISTRY%%/*}"

      - name: Build and push
        id: bake
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6.10.0
        env:
          # Bake variables (base-images/docker-bake.hcl).
          REGISTRY: ${{ inputs.registry }}
          ARCH: ${{ inputs.arch }}
          KAIROS_VERSION: ${{ inputs.kairos_version }}
          HADRON_VERSION: ${{ inputs.hadron_version }}
          BASE_OS_IMAGE: ${{ inputs.base_os_image }}
          # Build record artifact (.dockerbuild): logs, timings, provenance; no
          # secrets. Public repo, credential-free builds: keep it, but briefly.
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 7
          # Keep provenance out of the metadata output only (the images still
          # carry their provenance attestation). With it, `all` produces
          # metadata over the 128 KiB per-variable limit and the Summary step
          # cannot start ("Argument list too long").
          BUILDX_METADATA_PROVENANCE: disabled
        with:
          source: .
          workdir: base-images
          files: |
            docker-bake.hcl
            hadron/modules.json
          targets: ${{ steps.targets.outputs.targets }}
          # The shared eMudhra distrust script is read from ../scripts.
          allow: fs.read=..
          push: true

      - name: Summary
        if: always() && steps.bake.outputs.metadata != ''
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          ARCH: ${{ inputs.arch }}
          KAIROS_VERSION: ${{ inputs.kairos_version }}
          HADRON_VERSION: ${{ inputs.hadron_version }}
          REGISTRY: ${{ inputs.registry }}
          TARGETS: ${{ steps.targets.outputs.targets }}
          BASE_OS_IMAGE: ${{ inputs.base_os_image }}
        run: |
          {
            echo "## Base image build"
            echo ""
            echo "| Input | Value |"
            echo "|---|---|"
            echo "| Targets | \`${TARGETS}\` |"
            if [ -n "${BASE_OS_IMAGE}" ]; then echo "| Base OS image | \`${BASE_OS_IMAGE}\` |"; fi
            echo "| Architecture | \`${ARCH}\` |"
            echo "| Kairos version | \`${KAIROS_VERSION}\` |"
            echo "| Hadron version | \`${HADRON_VERSION}\` |"
            echo "| Registry | \`${REGISTRY}\` |"
            echo ""
            echo "### Pushed images"
            echo ""
            echo "| Target | Image | Digest |"
            echo "|---|---|---|"
            printf '%s' "${METADATA}" | jq -r '
              to_entries[]
              | select(.value | type == "object" and has("image.name"))
              | . as $t
              | ($t.value["image.name"] | split(","))[]
              | "| `\($t.key)` | `\(.)` | `\($t.value["containerimage.digest"] // "")` |"'
          } >> "$GITHUB_STEP_SUMMARY"

      # Self-hosted runner: do not leave registry credentials in ~/.docker.
      - name: Log out of the registry
        if: always()
        env:
          REGISTRY: ${{ inputs.registry }}
        run: docker logout "${REGISTRY%%/*}" || true
