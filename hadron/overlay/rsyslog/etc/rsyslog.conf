# Minimal rsyslog configuration for Hadron.
#
# rsyslog upstream ships no default configuration (distributions supply their
# own), so this file is maintained here.


#### MODULES ####

# Local system logging. Under systemd the listening socket is passed in by
# syslog.socket; imuxsock detects /run/systemd/journal/syslog and uses the
# handed-over file descriptor instead of creating a socket of its own.
module(load="imuxsock")

#### GLOBAL DIRECTIVES ####

# Permissions for files and directories rsyslog creates.
$FileOwner root
$FileGroup root
$FileCreateMode 0640
$DirCreateMode 0755
$Umask 0022

# Spool and state directory. Created by the unit's StateDirectory=rsyslog so it
# survives the persistent /var bind mount on Kairos.
$WorkDirectory /var/lib/rsyslog

#### RULES ####

# Emergency messages to all users and to avoid Rsyslog error 1023
*.emerg action(type="omusrmsg" users="*")

# Drop-in configuration, e.g. /etc/rsyslog.d/49-stylus.conf.
# mode="optional" keeps rsyslog quiet when the directory holds no files.
include(file="/etc/rsyslog.d/*.conf" mode="optional")

# Traditional file logging, disabled by default because journald already keeps
# these messages. Uncomment if you want plain-text log files as well.
#auth,authpriv.*                 action(type="omfile" file="/var/log/auth.log")
#*.*;auth,authpriv.none          action(type="omfile" file="/var/log/syslog")
#kern.*                          action(type="omfile" file="/var/log/kern.log")
