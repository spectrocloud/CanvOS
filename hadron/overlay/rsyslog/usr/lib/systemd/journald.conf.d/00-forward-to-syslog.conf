# journald's ForwardToSyslog defaults to no, so without this drop-in rsyslog
# would start, own /run/systemd/journal/syslog and never receive a message.
#
# A drop-in under /usr/lib is used rather than editing /etc/systemd/journald.conf
# because /etc/systemd is a persistent bind mount on Kairos and a build-time
# edit there is shadowed once the node has state.
[Journal]
ForwardToSyslog=yes
