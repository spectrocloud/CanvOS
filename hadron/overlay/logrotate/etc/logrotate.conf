# Rotate weekly, keeping four generations.
weekly
rotate 4

# Create a fresh empty log after rotating.
create

# Date-stamp rotated files rather than using .1/.2 suffixes.
dateext

# Do not fail the whole run when a log listed in a drop-in does not exist yet.
missingok
notifempty

# Compression is off globally; drop-ins that want it opt in. Note that the
# compress command is /bin/gzip, which on Hadron is a busybox applet.
#compress

# Drop-ins, e.g. /etc/logrotate.d/stylus.conf.
include /etc/logrotate.d
