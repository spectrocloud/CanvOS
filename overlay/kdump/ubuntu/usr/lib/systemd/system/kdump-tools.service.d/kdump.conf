# /etc/default/kdump-tools is not in the image: kdump-merge builds it from the image defaults and the
# operator overrides before every start, so it is optional until then. Skip when kdump cannot capture
# here (no crash memory reserved, or the recovery system).
[Service]
EnvironmentFile=
EnvironmentFile=-/etc/default/kdump-tools
ExecCondition=/usr/lib/kdump/kdump-merge --reserved
ExecStartPre=-/usr/lib/kdump/kdump-merge
