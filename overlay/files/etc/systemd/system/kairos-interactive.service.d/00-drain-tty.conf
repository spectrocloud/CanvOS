# PE-9111: drain any Enter keystrokes buffered on /dev/tty1 during the pre-TUI
# boot phase, BEFORE `kairos-agent interactive-install` starts.
#
# Without this, kairos-installer's bubbletea program (tea.NewProgram(...).Run
# in kairos-io/kairos-installer main.go) puts the tty in raw mode and starts
# an input-reader goroutine before model.Init() runs. The reader consumes the
# buffered Enters into bubbletea's internal tea.Msg channel, and they replay
# into the disk-erase / disk-select / reboot / start-install prompts as soon
# as each screen is drawn — aborting the install with
# `installation error: 1 error occurred: * exit status 1`.
#
# The drain switches tty1 out of canonical mode so a single non-blocking read
# pulls every pending byte in one syscall, then restores sane mode. bubbletea
# reconfigures termios itself when Run() enters raw mode, so restoring `sane`
# here is safe and leaves no state for the installer to fight.
#
# Leading `-` on ExecStartPre makes systemd ignore a non-zero exit — a drain
# failure must never block the installer from starting.
[Service]
ExecStartPre=-/bin/sh -c 'stty -F /dev/tty1 -icanon min 0 time 0 2>/dev/null; dd if=/dev/tty1 iflag=nonblock of=/dev/null bs=4096 count=1 status=none 2>/dev/null || true; stty -F /dev/tty1 sane 2>/dev/null || true'
