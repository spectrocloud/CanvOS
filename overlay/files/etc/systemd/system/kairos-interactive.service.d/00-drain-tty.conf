# PE-9111: drain Enter keystrokes buffered on /dev/tty1 during the pre-TUI boot
# phase, BEFORE `kairos-agent interactive-install` starts. See canvos commit
# message for the bubbletea rationale. This drop-in is instrumented so
# `journalctl -u kairos-interactive` tells us exactly what happened at boot.
[Service]
# Sanity marker so we can prove the drop-in was picked up at all.
ExecStartPre=/usr/bin/logger -t pe9111-drain "starting tty1 drain (drop-in loaded)"

# Snapshot termios and buffered-byte count BEFORE the drain. `stty -F -a` is
# the state; `/proc/tty/ldiscs` / `/proc/tty/driver/serial` are informational
# but the real signal is the byte count from the drain read.
ExecStartPre=/usr/bin/logger -t pe9111-drain "termios before: $(stty -F /dev/tty1 -a 2>&1 | tr '\n' ' ')"

# Force non-canonical mode so one read() pulls every pending byte at once,
# then drain into a byte counter, then restore sane.
ExecStartPre=-/bin/sh -c '\
  set +e; \
  stty -F /dev/tty1 -icanon min 0 time 0 2>&1 | /usr/bin/logger -t pe9111-drain --; \
  BYTES=$(dd if=/dev/tty1 iflag=nonblock bs=4096 count=1 status=none 2>/dev/null | wc -c); \
  /usr/bin/logger -t pe9111-drain "tty1 drained $BYTES byte(s)"; \
  stty -F /dev/tty1 sane 2>&1 | /usr/bin/logger -t pe9111-drain --; \
'

# Same treatment for /dev/console. On this ISO the kernel cmdline is
# `console=tty1 console=ttyS0`, which makes /dev/console a distinct device
# (the LAST console= wins for tty semantics — ttyS0 here). Buffered keystrokes
# on a serial console live on /dev/ttyS0, not /dev/tty1, so drain both.
ExecStartPre=-/bin/sh -c '\
  set +e; \
  for TTY in /dev/console /dev/ttyS0 /dev/tty0; do \
    [ -c "$TTY" ] || continue; \
    stty -F "$TTY" -icanon min 0 time 0 2>&1 | /usr/bin/logger -t pe9111-drain --; \
    BYTES=$(dd if="$TTY" iflag=nonblock bs=4096 count=1 status=none 2>/dev/null | wc -c); \
    /usr/bin/logger -t pe9111-drain "$TTY drained $BYTES byte(s)"; \
    stty -F "$TTY" sane 2>&1 | /usr/bin/logger -t pe9111-drain --; \
  done; \
'

ExecStartPre=/usr/bin/logger -t pe9111-drain "drain complete, handing off to kairos-agent"
