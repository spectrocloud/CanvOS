# MaxAuthTries override for every ISO and provider image built from this repo.
#
# Why: sshd permits only MaxAuthTries authentication attempts per connection,
# and every key a client offers before password auth spends one. kairos-init's
# /etc/ssh/sshd_config.d/05-kairos-hardening.conf sets 2, which is below what a
# stock client needs - an ssh-agent key plus one default identity file is
# already two offers - so the client is disconnected with "Too many
# authentication failures" before the password prompt. PasswordAuthentication
# stays enabled, so the failure reads as a credentials problem.
#
# Why this name: sshd keeps the FIRST value it reads for a directive and reads
# sshd_config.d/*.conf in lexical order, so this file must sort before
# kairos-init's 05-. Setting the 00- slot is safe here precisely because this
# file carries ONE directive: it cannot displace the crypto pins that also live
# at 00-/01- (ComplianceAsCode on FIPS/STIG images, Hadron's 01-/02-/03-), which
# is the reason kairos-init warns against moving sshd hardening wholesale to
# 00-.
#
# Why 4: it is the ceiling CIS allows (DIL 5.2.7 / Ubuntu 5.1.16, "Ensure SSH
# MaxAuthTries is set to 4 or less") and it matches the value kairos master
# sets in the same file. The DISA RHEL 9 and Ubuntu 24.04 STIGs contain no
# MaxAuthTries rule, and FIPS/NIST set nothing.
#
# Keep this file to the single directive. Anything else here is an unvetted
# sshd policy change applied to every image we ship.
#
# Removal trigger: delete this file once the kairos-init image this build pins
# sets MaxAuthTries >= 4 itself. Left in place it would also outrank a later
# upstream value.
MaxAuthTries 4
