# Entry point for the CD/removable GRUB build (gcdx64.efi.signed), whose
# embedded prefix is /boot/grub. It resolves that against the ISO9660 volume,
# so this file is where it looks first. Hand off to the real menu in
# /boot/grub2/grub.cfg, which is the layout the rest of the ISO uses.
#
# Without this file GRUB starts but finds no config and drops to a rescue prompt.
insmod iso9660
search --no-floppy --file --set=root /boot/kernel
set prefix=($root)/boot/grub2
configfile $prefix/grub.cfg
