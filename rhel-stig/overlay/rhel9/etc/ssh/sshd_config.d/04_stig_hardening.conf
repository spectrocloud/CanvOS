# Must sort before kairos-init's 05-kairos-hardening.conf: sshd keeps the first
# value it reads for each directive, and reads this directory in lexical order.
#
# Plain replacement lists, not '^'. '^' prepends to the defaults, which leaves
# the non-FIPS algorithms on offer for a peer to negotiate.
Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr
KexAlgorithms ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256
MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512
HostKeyAlgorithms ecdsa-sha2-nistp256,ecdsa-sha2-nistp384,ecdsa-sha2-nistp521,rsa-sha2-256,rsa-sha2-512

# kairos-init sets 2; a client carrying agent keys is disconnected before the
# password prompt. 4 is within the STIG and CIS limits.
MaxAuthTries 4
